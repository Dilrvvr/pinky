# XcodeGen spec for the standalone prototype; ../build.sh generates the
# project (never committed) and builds it.
name: PinkyStandalone
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 492J8Q67PF
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
    # One binary per part: build.sh signs the bundles, not a split-off
    # debug dylib, which iOS would refuse to load unsigned.
    ENABLE_DEBUG_DYLIB: NO

targetTemplates:
  # Links the Go core (build/core/libpinkycore.a).
  Core:
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Shared/Bridging.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/build/core
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/build/core
        OTHER_LDFLAGS: -lpinkycore -lresolv -framework Security -framework CoreFoundation
  AppBase:
    type: application
    platform: iOS
    templates: [Core]
    sources:
      - App
      - path: Shared
        excludes: ["*.h"]
      - Activity/PinkyActivity.swift
      - path: build/Pairing.json
        buildPhase: resources
  ActivityBase:
    type: app-extension
    platform: iOS
    sources:
      - Activity
      - Shared/PinkyCore.swift
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION

targets:
  PinkyStandalone:
    templates: [AppBase]
    dependencies:
      - target: PinkyTunnel
      - target: PinkyActivity
    info:
      path: build/gen/App-Info.plist
      properties: &appInfo
        CFBundleDisplayName: Pinky Local
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio]
        NSFaceIDUsageDescription: Pinky asks for Face ID before it goes ahead with a step you approve.
        # remotepairingd's advertisement on the loopback interface gives the
        # port the engine dials (PairingPort.swift).
        NSLocalNetworkUsageDescription: Pinky looks for this iPhone's own pairing service to control your apps.
        NSBonjourServices: [_remotepairing._tcp]
    entitlements:
      path: build/gen/cc.diygod.pinky.standalone.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.diygod.pinky.standalone

  PinkyTunnel:
    type: app-extension
    platform: iOS
    templates: [Core]
    sources:
      - Tunnel
      - path: Shared
        excludes: ["*.h"]
    info:
      path: build/gen/Tunnel-Info.plist
      properties:
        CFBundleDisplayName: Pinky Loopback
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: build/gen/cc.diygod.pinky.standalone.tunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.diygod.pinky.standalone.tunnel

  PinkyActivity:
    templates: [ActivityBase]
    info:
      path: build/gen/Activity-Info.plist
      properties: &activityInfo
        CFBundleDisplayName: Pinky
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.diygod.pinky.standalone.activity

  # Without a tunnel of its own: LocalDevVPN reflects the packets and the
  # engine runs in the app. Its ids fall under the team's wildcard profile,
  # so it needs no App IDs of its own.
  PinkyStandaloneLite:
    templates: [AppBase]
    dependencies:
      - target: PinkyActivityLite
    info:
      path: build/gen/AppLite-Info.plist
      properties: *appInfo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.diygod.pinky.standalone.lite
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) NO_TUNNEL

  PinkyActivityLite:
    templates: [ActivityBase]
    info:
      path: build/gen/ActivityLite-Info.plist
      properties: *activityInfo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.diygod.pinky.standalone.lite.activity
